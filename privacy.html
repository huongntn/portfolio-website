<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy | Thi Ngoc Huong Nguyen</title>
  <meta name="description" content="Software engineer building deterministic backend pipelines and minimal, text-first web environments.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  
  <style>
    :root {
      --background-body: #f5f5f5;
      --text-main: #252121;
      --text-light: #747f80;
      --brand-orange: #f26822;
      --white: #ffffff;
      --menu-sand: #eaddd7;
      --font-headers: 'Montserrat', sans-serif;
      --font-body: 'Source Serif Pro', serif;
    }

    * { box-sizing: border-box; }
    body { background-color: var(--background-body); color: var(--text-main); font-family: var(--font-body); font-size: 1.15rem; line-height: 1.65; margin: 0; padding: 0; }
    .container { max-width: 960px; margin: 0 auto; padding: 0 1.5rem; }

    /* Header & Navigation */
    header { background-color: var(--menu-sand); border-bottom: 1px solid var(--text-main); padding: 2rem 0; }
    .nav-wrapper { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: var(--font-headers); font-weight: 800; font-size: 1.5rem; color: var(--text-main); text-decoration: none; text-transform: uppercase; letter-spacing: -1.5px; }
    .nav-links a { font-family: var(--font-headers); color: var(--text-main); text-decoration: none; font-weight: 700; text-transform: uppercase; font-size: 0.85rem; margin-left: 1.75rem; letter-spacing: 0.5px; }
    .nav-links a:hover { color: var(--brand-orange); }

    /* Content & Typography */
    .hero { padding: 6rem 0 3rem 0; }
    h1 { font-family: var(--font-headers); font-weight: 800; font-size: 2.75rem; margin: 0 0 1.5rem 0; text-transform: uppercase; }
    section { padding: 4rem 0; }
    h2 { font-family: var(--font-headers); font-size: 1.75rem; font-weight: 800; text-transform: uppercase; margin: 0 0 1.5rem 0; }
    p { margin: 0 0 1.5rem 0; }
    a { color: var(--text-main); text-decoration: none; box-shadow: inset 0 -2px 0 var(--text-light); transition: box-shadow 0.15s, color 0.15s; }
    a:hover { color: var(--brand-orange); box-shadow: inset 0 -2px 0 var(--brand-orange); }
    hr { border: none; border-top: 1px solid var(--text-main); margin: 0; }

    /* Footer (Strictly matched to Homepage) */
    footer { background-color: var(--text-main); color: var(--white); padding: 4rem 0 3rem 0; margin-top: 5rem; }
    .footer-links-row { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }
    @media (min-width: 768px) { .footer-links-row { flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; } }
    .social-icons { display: flex; gap: 1.5rem; }
    .social-icons a { color: var(--white); font-size: 1.35rem; }
    .social-icons a:hover { color: var(--brand-orange); }
    .legal-nav { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .legal-nav a { color: var(--white); text-decoration: none; font-family: var(--font-headers); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .legal-nav a:hover { color: var(--brand-orange); }
    .footer-bottom-brand { border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1.5rem; }
    .footer-bottom-brand p { margin: 0; font-size: 0.85rem; color: var(--text-light); }
  </style>
</head>
<body>

  <header>
    <div class="container nav-wrapper">
      <a href="/" class="logo">Huong Nguyen</a>
      <nav class="nav-links">
        <a href="/#work">Work</a>
        <a href="/#strategy">About</a>
        <a href="/blogs/">Blogs</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="hero"><h1>Privacy Policy</h1></div>
    <hr>
    <!-- Policy content remains as previously established -->
    <section>
      <h2>Data Handling</h2>
      <p>Your personal data is treated with the same integrity and focus on deterministic outcomes as the systems I engineer. No tracking cookies are used to monitor user behavior.</p>
    </section>
  </main>

  <footer>
    <div class="container footer-wrapper">
      <div class="footer-links-row">
        <div class="social-icons">
          <a href="https://github.com/huongntn" target="_blank" rel="noopener" aria-label="GitHub Profile"><i class="fa-brands fa-github"></i></a>
          <a href="https://www.linkedin.com/in/nguyen-huong" target="_blank" rel="noopener" aria-label="LinkedIn Profile"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <nav class="legal-nav">
          <a href="/impress">Imprint</a>
          <a href="/privacy.html">Privacy Policy</a>
        </nav>
      </div>
      <div class="footer-bottom-brand">
        <p>&copy; 2026 Thi Ngoc Huong Nguyen</p>
      </div>
    </div>
  </footer>

</body>
</html>
